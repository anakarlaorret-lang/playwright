name: Playwright CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_ui:
        description: Run UI tests against the public hosted demo
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: playwright-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-api:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run API tests
        run: npx playwright test tests/api.spec.ts

      - name: Upload API test report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  ui-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.run_ui
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI tests against hosted demo
        run: npx playwright test tests/homepage.spec.ts tests/login.spec.ts tests/mocking.spec.ts tests/product.spec.ts tests/responsive.spec.ts

      - name: Upload UI test report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            playwright-report/
            test-results/
            !test-results/**/*.webm
          retention-days: 7
          if-no-files-found: ignore
